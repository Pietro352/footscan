<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footscan</title>
    <meta name="description" content="Footscan: risultati e partite di calcio, dati reali e aggiornati.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #111214;
            --surface: #17181b;
            --line: #26282c;
            --text: #ececea;
            --muted: #8d9097;
            --amber: #e9b35f;
            --font: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            padding: 0 clamp(20px, 5vw, 48px);
            -webkit-font-smoothing: antialiased;
        }

        .wrap {
            max-width: 960px;
            margin: 0 auto;
        }

        button {
            font: inherit;
            color: inherit;
        }

        button:focus-visible {
            outline: 2px solid var(--amber);
            outline-offset: -2px;
        }

        /* Header */
        header {
            padding: clamp(64px, 12vw, 128px) 0 clamp(36px, 6vw, 64px);
        }

        h1 {
            font-size: clamp(3.4rem, 12vw, 6.5rem);
            font-weight: 600;
            letter-spacing: -0.045em;
            line-height: 0.95;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: clamp(1rem, 2vw, 1.15rem);
            color: var(--muted);
            max-width: 34ch;
        }

        /* Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .datebar {
            align-self: flex-start;
            display: flex;
            align-items: stretch;
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
        }

        .datebar button {
            background: var(--bg);
            border: 0;
            color: var(--muted);
            height: 44px;
            min-width: 44px;
            padding: 0 14px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .datebar button:hover {
            background: var(--surface);
            color: var(--text);
        }

        .datebar .today {
            font-size: 0.95rem;
            font-weight: 500;
        }

        #selected-date {
            display: grid;
            place-items: center;
            min-width: 200px;
            padding: 0 18px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            border-left: 1px solid var(--line);
            border-right: 1px solid var(--line);
        }

        .datebar .today {
            border-left: 1px solid var(--line);
        }

        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .chips::-webkit-scrollbar {
            display: none;
        }

        .chip {
            flex-shrink: 0;
            background: none;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--muted);
            padding: 8px 15px;
            font-size: 0.9rem;
            white-space: nowrap;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .chip:hover {
            color: var(--text);
            border-color: var(--muted);
        }

        .chip.active {
            background: var(--text);
            border-color: var(--text);
            color: var(--bg);
        }

        /* Sections */
        .section {
            margin-top: clamp(36px, 6vw, 64px);
        }

        .section-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .section-head h2 {
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: -0.015em;
            line-height: 1.2;
        }

        .count {
            font-size: 0.95rem;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--amber);
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Matches: one bordered block, cells separated by hairlines */
        .matches {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1px;
            background: var(--line);
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow: hidden;
        }

        .match, .filler {
            background: var(--bg);
        }

        .match {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 132px;
            padding: 20px 24px 20px;
            transition: background 0.2s ease;
        }

        .match:hover {
            background: var(--surface);
        }

        .match-top {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .comp {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status {
            flex-shrink: 0;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        .status.live {
            color: var(--amber);
        }

        .rows {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            font-size: 1.1rem;
            font-weight: 500;
            line-height: 1.3;
        }

        .row .name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .row .pts {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .row.lose {
            color: var(--muted);
        }

        /* Notes: loading, empty, error */
        .note {
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 22px 24px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .note strong {
            display: block;
            color: var(--text);
            font-weight: 600;
            margin-bottom: 2px;
        }

        .note.error strong {
            color: var(--amber);
        }

        /* Footer */
        footer {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 24px;
            margin-top: clamp(48px, 8vw, 88px);
            padding: 36px 0 44px;
            border-top: 1px solid var(--line);
            font-size: 0.9rem;
            color: var(--muted);
        }

        @media (max-width: 680px) {
            .matches {
                grid-template-columns: 1fr;
            }

            .filler {
                display: none;
            }

            .match {
                min-height: 0;
                padding: 18px 20px;
            }

            .datebar {
                align-self: stretch;
            }

            #selected-date {
                flex: 1;
                min-width: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <h1>Footscan</h1>
            <p class="subtitle">Risultati e partite di calcio, aggiornati.</p>
        </header>

        <main>
            <div class="controls">
                <div class="datebar">
                    <button id="prevDayBtn" aria-label="Giorno precedente">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
                    </button>
                    <span id="selected-date" aria-live="polite"></span>
                    <button id="nextDayBtn" aria-label="Giorno successivo">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
                    </button>
                    <button id="todayBtn" class="today">Oggi</button>
                </div>
                <div class="chips" id="leagueFilterContainer" role="group" aria-label="Competizioni"></div>
            </div>

            <section class="section">
                <div class="section-head">
                    <span class="live-dot" aria-hidden="true"></span>
                    <h2>In diretta</h2>
                    <span class="count" id="liveCount"></span>
                </div>
                <div id="liveMatchesContainer"><div class="note">Caricamento…</div></div>
            </section>

            <section class="section">
                <div class="section-head">
                    <h2>Risultati</h2>
                    <span class="count" id="pastCount"></span>
                </div>
                <div id="pastMatchesContainer"><div class="note">Caricamento…</div></div>
            </section>

            <section class="section">
                <div class="section-head">
                    <h2>Prossime partite</h2>
                    <span class="count" id="upcomingCount"></span>
                </div>
                <div id="upcomingMatchesContainer"><div class="note">Caricamento…</div></div>
            </section>
        </main>

        <footer>
            <span>Made by HappyDeveloper</span>
            <span>Dati da football-data.org · aggiornamento ogni ~10 minuti</span>
        </footer>
    </div>

    <script>
        // Dati aggiornati da GitHub Actions (vedi .github/workflows/update-matches.yml)
        const DATA_URL = 'data/matches.json';
        const REFRESH_MS = 60000;
        const CACHE_MS = 45000;

        const LIVE_STATUSES = ['IN_PLAY', 'PAUSED', 'LIVE'];
        const UPCOMING_STATUSES = ['SCHEDULED', 'TIMED'];

        const leagues = [
            { code: 'WC', name: 'Mondiali' },
            { code: 'EC', name: 'Europei' },
            { code: 'CL', name: 'Champions League' },
            { code: 'SA', name: 'Serie A' },
            { code: 'PL', name: 'Premier League' },
            { code: 'PD', name: 'La Liga' },
            { code: 'BL1', name: 'Bundesliga' },
            { code: 'FL1', name: 'Ligue 1' },
            { code: 'ELC', name: 'Championship' },
            { code: 'DED', name: 'Eredivisie' },
            { code: 'PPL', name: 'Primeira Liga' },
            { code: 'BSA', name: 'Brasile Serie A' }
        ];

        const containers = {
            live: document.getElementById('liveMatchesContainer'),
            past: document.getElementById('pastMatchesContainer'),
            upcoming: document.getElementById('upcomingMatchesContainer')
        };
        const counters = {
            live: document.getElementById('liveCount'),
            past: document.getElementById('pastCount'),
            upcoming: document.getElementById('upcomingCount')
        };
        const emptyText = {
            live: 'Nessuna partita in diretta.',
            past: 'Nessun risultato per questa data e competizione.',
            upcoming: 'Nessuna partita in programma nei prossimi giorni.'
        };

        let currentDate = new Date();
        let selectedLeague = null;
        let requestId = 0;
        const cache = new Map();

        function formatDate(date) {
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function addDays(date, days) {
            const d = new Date(date);
            d.setDate(d.getDate() + days);
            return d;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        function updateDateUI() {
            document.getElementById('selected-date').textContent = currentDate.toLocaleDateString('it-IT', {
                weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
            });
        }

        function renderLeagueFilters() {
            const container = document.getElementById('leagueFilterContainer');
            container.innerHTML = '';
            const all = [{ code: '', name: 'Tutte' }, ...leagues];
            all.forEach(league => {
                const btn = document.createElement('button');
                btn.className = 'chip';
                btn.type = 'button';
                btn.textContent = league.name;
                btn.dataset.league = league.code;
                if ((selectedLeague || '') === league.code) btn.classList.add('active');
                btn.addEventListener('click', () => {
                    container.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedLeague = league.code || null;
                    load();
                });
                container.appendChild(btn);
            });
        }

        // Il file JSON è aggiornato da GitHub Actions: lo si scarica una volta
        // e le partite del giorno si ricavano filtrando (data locale + competizione).
        let dataPromise = null;
        let dataTime = 0;

        function loadData() {
            if (dataPromise && Date.now() - dataTime < CACHE_MS) return dataPromise;
            dataTime = Date.now();
            dataPromise = fetch(`${DATA_URL}?v=${Date.now()}`, { cache: 'no-store' })
                .then(response => {
                    if (!response.ok) throw new Error('File dei dati non trovato. Esegui il workflow "Aggiorna partite" su GitHub.');
                    return response.json();
                })
                .then(data => ({
                    from: data.from || '',
                    to: data.to || '',
                    matches: Array.isArray(data.matches) ? data.matches : []
                }))
                .catch(error => {
                    dataPromise = null;
                    throw error;
                });
            return dataPromise;
        }

        function matchesForDay(data, date) {
            const day = formatDate(date);
            return data.matches.filter(m => {
                if (!m.utcDate || formatDate(new Date(m.utcDate)) !== day) return false;
                return !selectedLeague || m.competition?.code === selectedLeague;
            });
        }

        function byTime(a, b) {
            return String(a.utcDate || '').localeCompare(String(b.utcDate || ''));
        }

        function loadUpcoming(data, scheduledToday) {
            let list = [...scheduledToday];
            for (let offset = 1; list.length < 6 && offset <= 3; offset++) {
                const matches = matchesForDay(data, addDays(currentDate, offset));
                list = list.concat(matches.filter(m => UPCOMING_STATUSES.includes(m.status)));
            }
            return list.sort(byTime).slice(0, 9);
        }

        async function load(silent = false) {
            const id = ++requestId;
            if (!silent) {
                Object.keys(containers).forEach(type => {
                    containers[type].innerHTML = '<div class="note">Caricamento…</div>';
                    counters[type].textContent = '';
                });
            }

            let data;
            try {
                data = await loadData();
            } catch (err) {
                if (id === requestId) renderError(err);
                return;
            }
            if (id !== requestId) return;

            const day = matchesForDay(data, currentDate);
            const dayStr = formatDate(currentDate);
            const outOfRange = !data.from || dayStr < data.from || dayStr > data.to;
            emptyText.past = outOfRange
                ? (data.from ? `Dati disponibili solo dal ${data.from.split('-').reverse().join('/')} al ${data.to.split('-').reverse().join('/')}.` : 'Dati in arrivo: attendi il primo aggiornamento.')
                : 'Nessun risultato per questa data e competizione.';

            const live = day.filter(m => LIVE_STATUSES.includes(m.status)).sort(byTime);
            const scheduled = day.filter(m => UPCOMING_STATUSES.includes(m.status)).sort(byTime);
            const past = day.filter(m => !LIVE_STATUSES.includes(m.status) && !UPCOMING_STATUSES.includes(m.status)).sort(byTime);

            renderMatches(live, 'live');
            renderMatches(past, 'past');

            renderMatches(loadUpcoming(data, scheduled), 'upcoming');
        }

        function renderError(err, types = ['live', 'past', 'upcoming']) {
            const message = err.status === 429
                ? 'Troppe richieste. Riprova tra un minuto.'
                : (err.message || 'Dati reali non disponibili in questo momento.');
            const html = `<div class="note error"><strong>Dati non disponibili</strong>${escapeHtml(message)}</div>`;
            types.forEach(type => {
                containers[type].innerHTML = html;
                counters[type].textContent = '';
            });
        }

        function statusInfo(match) {
            switch (match.status) {
                case 'IN_PLAY':
                case 'LIVE':
                    return { text: 'In diretta', live: true };
                case 'PAUSED':
                    return { text: 'Intervallo', live: true };
                case 'FINISHED':
                case 'AWARDED':
                    return { text: 'Finale', live: false };
                case 'POSTPONED':
                    return { text: 'Rinviata', live: false };
                case 'SUSPENDED':
                    return { text: 'Sospesa', live: false };
                case 'CANCELLED':
                    return { text: 'Annullata', live: false };
                case 'SCHEDULED':
                case 'TIMED': {
                    if (!match.utcDate) return { text: 'Da definire', live: false };
                    const d = new Date(match.utcDate);
                    const day = d.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' });
                    const time = d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
                    return { text: `${day} · ${time}`, live: false };
                }
                default:
                    return { text: match.status || '', live: false };
            }
        }

        function renderMatches(matches, type) {
            const container = containers[type];
            counters[type].textContent = matches.length ? String(matches.length) : '';

            if (!matches.length) {
                container.innerHTML = `<div class="note">${emptyText[type]}</div>`;
                return;
            }

            const cells = matches.map(match => {
                const home = match.homeTeam?.name || 'Squadra';
                const away = match.awayTeam?.name || 'Squadra';
                const sh = match.score?.fullTime?.home;
                const sa = match.score?.fullTime?.away;
                const hasScore = type !== 'upcoming' && sh != null && sa != null;
                const finished = match.status === 'FINISHED' || match.status === 'AWARDED';
                const status = statusInfo(match);
                const homeLose = finished && hasScore && sh < sa ? ' lose' : '';
                const awayLose = finished && hasScore && sa < sh ? ' lose' : '';
                const pts = value => (type === 'upcoming' ? '' : `<span class="pts">${hasScore ? value : '–'}</span>`);

                return `
                    <article class="match">
                        <div class="match-top">
                            <span class="comp">${escapeHtml(match.competition?.name || 'Competizione')}</span>
                            <span class="status${status.live ? ' live' : ''}">${escapeHtml(status.text)}</span>
                        </div>
                        <div class="rows">
                            <div class="row${homeLose}"><span class="name">${escapeHtml(home)}</span>${pts(sh)}</div>
                            <div class="row${awayLose}"><span class="name">${escapeHtml(away)}</span>${pts(sa)}</div>
                        </div>
                    </article>`;
            });

            // Su due colonne, con numero dispari di partite, riempie la cella vuota.
            if (matches.length % 2 === 1) cells.push('<div class="filler" aria-hidden="true"></div>');
            container.innerHTML = `<div class="matches">${cells.join('')}</div>`;
        }

        function changeDate(delta) {
            currentDate = addDays(currentDate, delta);
            updateDateUI();
            load();
        }

        function goToday() {
            currentDate = new Date();
            updateDateUI();
            load();
        }

        function init() {
            renderLeagueFilters();
            updateDateUI();
            load();

            setInterval(() => {
                if (!document.hidden && formatDate(currentDate) === formatDate(new Date())) load(true);
            }, REFRESH_MS);

            document.getElementById('prevDayBtn').addEventListener('click', () => changeDate(-1));
            document.getElementById('nextDayBtn').addEventListener('click', () => changeDate(1));
            document.getElementById('todayBtn').addEventListener('click', goToday);
        }

        init();
    </script>
</body>
</html>
