    <script>
        // I dati live arrivano da ESPN (API pubblica, senza chiave) direttamente dal browser.
        // Se ESPN non fosse raggiungibile si ripiega su data/matches.json (aggiornato da GitHub Actions).
        const ESPN_URL = 'https://site.api.espn.com/apis/site/v2/sports/soccer';
        const FALLBACK_URL = 'data/matches.json';
        const FAV_KEY = 'footscan:favorite';
        const THEME_KEY = 'footscan:theme';

        const DAYS_BACK = 3;
        const DAYS_AHEAD = 6;
        const STRIP_RADIUS = 7;          // giorni mostrati ai due lati della data scelta
        const LIVE_REFRESH_MS = 45000;   // con partite in corso o in partenza
        const IDLE_REFRESH_MS = 180000;  // altrimenti
        const FULL_REFRESH_MS = 300000;  // ricarica completa della finestra di giorni
        const DETAIL_REFRESH_MS = 30000; // dettaglio di una partita in diretta

        const LIVE_STATUSES = ['IN_PLAY', 'PAUSED', 'LIVE'];
        const UPCOMING_STATUSES = ['SCHEDULED', 'TIMED'];

        const leagues = [
            { slug: 'fifa.world', code: 'WC', name: 'Mondiali' },
            { slug: 'uefa.euro', code: 'EC', name: 'Europei' },
            { slug: 'uefa.champions', code: 'CL', name: 'Champions League' },
            { slug: 'uefa.europa', code: 'EL', name: 'Europa League' },
            { slug: 'uefa.europa.conf', code: 'ECL', name: 'Conference League' },
            { slug: 'ita.1', code: 'SA', name: 'Serie A' },
            { slug: 'eng.1', code: 'PL', name: 'Premier League' },
            { slug: 'esp.1', code: 'PD', name: 'La Liga' },
            { slug: 'ger.1', code: 'BL1', name: 'Bundesliga' },
            { slug: 'fra.1', code: 'FL1', name: 'Ligue 1' },
            { slug: 'eng.2', code: 'ELC', name: 'Championship' },
            { slug: 'ned.1', code: 'DED', name: 'Eredivisie' },
            { slug: 'por.1', code: 'PPL', name: 'Primeira Liga' },
            { slug: 'bra.1', code: 'BSA', name: 'Brasile Serie A' }
        ];

        const THEMES = [
            { id: 'auto', name: 'Auto', swatch: 'linear-gradient(135deg, #111214 50%, #f7f6f2 50%)', dot: '#e9b35f' },
            { id: 'night', name: 'Notte', swatch: '#111214', dot: '#e9b35f', bg: '#111214' },
            { id: 'day', name: 'Giorno', swatch: '#f7f6f2', dot: '#a85f00', bg: '#f7f6f2' },
            { id: 'pitch', name: 'Stadio', swatch: '#0b1a11', dot: '#b6f04a', bg: '#0b1a11' },
            { id: 'gazzetta', name: 'Gazzetta', swatch: '#f8d9d2', dot: '#c0134f', bg: '#f8d9d2' },
            { id: 'ocean', name: 'Oceano', swatch: '#0a1624', dot: '#4cc9f0', bg: '#0a1624' },
            { id: 'sunset', name: 'Tramonto', swatch: '#1a1020', dot: '#ff8a5b', bg: '#1a1020' },
            { id: 'contrast', name: 'Contrasto', swatch: '#000000', dot: '#ffe600', bg: '#000000' }
        ];

        const $ = id => document.getElementById(id);
        const listContainer = $('listContainer');
        const statusSeg = $('statusSeg');
        const dayStrip = $('dayStrip');
        const favBar = $('favBar');
        const favHint = $('favHint');
        const favSection = $('favSection');
        const favContainer = $('favContainer');
        const updatedEl = $('updated');
        const dlg = $('matchDialog');
        const dlgTop = $('dlgTop');
        const dlgHead = $('dlgHead');
        const dlgTabs = $('dlgTabs');
        const dlgBody = $('dlgBody');

        // ---- Stato ----
        const store = new Map();          // id partita -> partita normalizzata
        const details = new Map();        // id partita -> { data, error } dal servizio "summary" di ESPN
        let source = 'live';              // 'live' (ESPN) oppure 'archive' (data/matches.json)
        let loaded = false;
        let windowFrom = '';
        let windowTo = '';
        let lastUpdate = null;
        let lastFull = 0;
        let failedLeagues = 0;
        let liveError = false;
        let currentDate = new Date();
        let selectedLeague = null;
        let statusFilter = 'all';         // all | live | results | upcoming
        let requestId = 0;
        let inflight = null;
        let tickTimer = null;
        let favorite = readFavorite();
        let openId = null;
        let openTab = 'cronaca';
        let dlgMatch = null;
        let detailTimer = null;
        const lastHtml = {};

        // ---- Utilità ----
        function formatDate(date) {
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function parseDay(str) {
            const [y, m, d] = str.split('-').map(Number);
            return new Date(y, m - 1, d, 12);
        }

        function addDays(date, days) {
            const d = new Date(date);
            d.setDate(d.getDate() + days);
            return d;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
        const fixMin = s => String(s || '').replace(/'\+/g, '+');
        const timeOf = d => d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
        const icon = (id, cls = '') => `<svg class="ico${cls ? ' ' + cls : ''}" aria-hidden="true"><use href="#${id}"/></svg>`;

        function byTime(a, b) {
            return String(a.utcDate || '').localeCompare(String(b.utcDate || ''));
        }

        const isLive = m => LIVE_STATUSES.includes(m.status);
        const isUpcoming = m => UPCOMING_STATUSES.includes(m.status);
        const isFinished = m => m.status === 'FINISHED' || m.status === 'AWARDED';
        const hasStarted = m => !isUpcoming(m) && !['POSTPONED', 'CANCELLED'].includes(m.status);

        function setHtml(key, element, html) {
            if (lastHtml[key] === html) return;
            lastHtml[key] = html;
            element.innerHTML = html;
        }

        // ---- Squadra preferita ----
        function readFavorite() {
            try {
                const value = JSON.parse(localStorage.getItem(FAV_KEY) || 'null');
                return value && value.key ? value : null;
            } catch (e) {
                return null;
            }
        }

        function saveFavorite() {
            try {
                if (favorite) localStorage.setItem(FAV_KEY, JSON.stringify(favorite));
                else localStorage.removeItem(FAV_KEY);
            } catch (e) { /* storage non disponibile: la scelta vale solo per questa sessione */ }
        }

        const teamKey = team => String(team?.id || team?.name || '');

        function isFav(team) {
            if (!favorite || !team) return false;
            return teamKey(team) === favorite.key || (!!team.name && team.name === favorite.name);
        }

        function findTeam(key) {
            for (const m of store.values()) {
                if (teamKey(m.homeTeam) === key) return m.homeTeam;
                if (teamKey(m.awayTeam) === key) return m.awayTeam;
            }
            return null;
        }

        function favoriteTeam() {
            return findTeam(favorite.key) || { id: favorite.key, name: favorite.name, logo: favorite.logo };
        }

        function toggleFavorite(key, name) {
            if (favorite && (favorite.key === key || favorite.name === name)) {
                favorite = null;
            } else {
                const team = findTeam(key);
                favorite = { key, name: team?.name || name, logo: team?.logo || '' };
            }
            saveFavorite();
            render();
        }

        // ---- Stemmi in un cerchio (con iniziali se l'immagine manca o non si carica) ----
        const SKIP_WORDS = new Set(['fc', 'ac', 'cf', 'sc', 'afc', 'ssc', 'us', 'as', 'rc', 'sk', 'fk', 'cd', 'ud', 'de', 'da', 'di', 'del', 'la', 'le', 'the', 'club', 'clube']);

        function initials(name) {
            const all = String(name || '?').replace(/[^\p{L}\p{N} ]/gu, ' ').split(/\s+/).filter(Boolean);
            const words = all.filter(w => !SKIP_WORDS.has(w.toLowerCase()));
            const use = words.length ? words : all;
            if (!use.length) return '?';
            return (use.length === 1 ? use[0].slice(0, 3) : use[0][0] + use[1][0]).toUpperCase();
        }

        function crestHtml(team, size = '') {
            const logo = team?.logo;
            return `<span class="crest${size ? ' ' + size : ''}${logo ? '' : ' noimg'}" data-initials="${escapeHtml(initials(team?.name))}">${
                logo ? `<img src="${escapeHtml(logo)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">` : ''
            }</span>`;
        }

        document.addEventListener('error', event => {
            const el = event.target;
            if (el && el.tagName === 'IMG') el.closest('.crest')?.classList.add('noimg');
        }, true);
        document.addEventListener('load', event => {
            const el = event.target;
            if (el && el.tagName === 'IMG' && el.closest('.crest') && el.naturalWidth < 2) el.closest('.crest').classList.add('noimg');
        }, true);

        function starHtml(team, fav) {
            const label = fav ? `Rimuovi ${team.name} dalle preferite` : `Imposta ${team.name} come squadra preferita`;
            return `<button type="button" class="star" data-key="${escapeHtml(teamKey(team))}" data-name="${escapeHtml(team.name)}" aria-pressed="${fav ? 'true' : 'false'}" aria-label="${escapeHtml(label)}" title="${escapeHtml(label)}"><svg width="15" height="15" viewBox="0 0 24 24" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 16.9 6.7 19.7l1.1-5.9L3.5 9.7l5.9-.8z"/></svg></button>`;
        }

        // ---- Dati da ESPN ----
        const num = value => {
            const n = parseInt(value, 10);
            return Number.isFinite(n) ? n : null;
        };

        function mapStatus(type = {}) {
            const name = String(type.name || '').toUpperCase();
            if (name.includes('POSTPONED')) return 'POSTPONED';
            if (name.includes('CANCEL')) return 'CANCELLED';
            if (name.includes('SUSPENDED') || name.includes('ABANDONED')) return 'SUSPENDED';
            if (name.includes('HALFTIME')) return 'PAUSED';
            if (type.state === 'in') return 'IN_PLAY';
            if (type.state === 'post') return 'FINISHED';
            return 'SCHEDULED';
        }

        function espnTeam(competitor) {
            const t = competitor.team || {};
            const id = String(t.id ?? '');
            return {
                id,
                name: t.displayName || t.shortDisplayName || t.name || 'Squadra',
                logo: t.logo || (id ? `https://a.espncdn.com/i/teamlogos/soccer/500/${id}.png` : '')
            };
        }

        // Cognome del giocatore ("G. Ramos" -> "Ramos")
        function playerName(athlete) {
            const short = String(athlete?.shortName || '').replace(/^(?:\p{L}\.\s*)+/u, '').trim();
            return short || athlete?.displayName || '';
        }

        // Gol e cartellini rossi dalla scoreboard di ESPN.
        // Per i gol, "tid" è la squadra a cui va il gol (negli autogol è quella avvantaggiata).
        function espnEvents(comp) {
            const out = [];
            for (const d of comp?.details || []) {
                if (d.shootout) continue;
                const tid = String(d.team?.id ?? '');
                const name = playerName(d.athletesInvolved?.[0]);
                const m = fixMin(d.clock?.displayValue);
                if (d.scoringPlay) out.push({ k: d.ownGoal ? 'o' : d.penaltyKick ? 'p' : 'g', tid, n: name, m });
                else if (d.redCard) out.push({ k: 'r', tid, n: name, m });
            }
            return out;
        }

        function normalizeEvent(ev, league) {
            const comp = ev.competitions?.[0];
            const home = comp?.competitors?.find(c => c.homeAway === 'home');
            const away = comp?.competitors?.find(c => c.homeAway === 'away');
            if (!home || !away || !ev.date) return null;
            const st = ev.status || comp.status || {};
            const status = mapStatus(st.type);
            const started = !['SCHEDULED', 'POSTPONED', 'CANCELLED'].includes(status);
            const ph = num(home.shootoutScore);
            const pa = num(away.shootoutScore);
            return {
                id: String(ev.id),
                utcDate: new Date(ev.date).toISOString(),
                status,
                clock: st.type?.state === 'in' ? (st.displayClock || '') : '',
                detail: status === 'FINISHED' ? String(st.type?.shortDetail || '') : '',
                competition: { code: league.code, name: league.name, slug: league.slug },
                homeTeam: espnTeam(home),
                awayTeam: espnTeam(away),
                score: {
                    fullTime: { home: started ? num(home.score) : null, away: started ? num(away.score) : null },
                    penalties: ph != null && pa != null ? { home: ph, away: pa } : null
                },
                events: started ? espnEvents(comp) : []
            };
        }

        const ymd = date => formatDate(date).replace(/-/g, '');
        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        async function fetchLeague(league, date) {
            // ESPN non accetta intervalli di date (dates=DA-A risponde 400): una richiesta per giorno.
            const url = `${ESPN_URL}/${league.slug}/scoreboard?dates=${ymd(date)}&limit=400`;
            let lastError;
            for (let attempt = 0; attempt < 3; attempt++) {
                try {
                    const response = await fetch(url, { cache: 'no-store' });
                    if (!response.ok) throw new Error(`ESPN ha risposto ${response.status}`);
                    const payload = await response.json();
                    return (payload.events || []).map(ev => normalizeEvent(ev, league)).filter(Boolean);
                } catch (err) {
                    lastError = err;
                    await sleep(400 * (attempt + 1));
                }
            }
            throw lastError;
        }

        // Esegue i job con al massimo `limit` richieste contemporanee, per non farsi bloccare da ESPN.
        async function runPool(jobs, limit) {
            const results = new Array(jobs.length);
            let next = 0;
            const workers = Array.from({ length: Math.min(limit, jobs.length) }, async () => {
                while (next < jobs.length) {
                    const i = next++;
                    try {
                        results[i] = { ok: true, value: await jobs[i]() };
                    } catch (err) {
                        results[i] = { ok: false, error: err };
                    }
                }
            });
            await Promise.all(workers);
            return results;
        }

        async function fetchRange(from, to) {
            const dates = [];
            for (let d = new Date(from); d <= to; d = addDays(d, 1)) dates.push(new Date(d));
            const jobs = [];
            const owners = [];
            for (const league of leagues) {
                for (const date of dates) {
                    jobs.push(() => fetchLeague(league, date));
                    owners.push(league.code);
                }
            }
            const results = await runPool(jobs, 6);
            // Una competizione conta come scaricata solo se tutti i suoi giorni sono arrivati,
            // così non si sostituiscono dati completi con dati parziali.
            const matches = [];
            const okCodes = [];
            for (const league of leagues) {
                const mine = results.filter((_, i) => owners[i] === league.code);
                if (mine.every(r => r.ok)) {
                    okCodes.push(league.code);
                    mine.forEach(r => matches.push(...r.value));
                }
            }
            return { matches, okCodes, failed: leagues.length - okCodes.length };
        }

        async function loadArchive() {
            const response = await fetch(`${FALLBACK_URL}?v=${Date.now()}`, { cache: 'no-store' });
            if (!response.ok) throw new Error('Dati non raggiungibili. Riprova tra poco.');
            const data = await response.json();
            store.clear();
            (Array.isArray(data.matches) ? data.matches : []).forEach(m => store.set(String(m.id), m));
            windowFrom = data.from || '';
            windowTo = data.to || '';
            source = 'archive';
        }

        async function doRefresh(mode) {
            if (mode === 'live' && source === 'live') {
                // Aggiornamento leggero: solo ieri-oggi-domani, unito ai dati già presenti
                const res = await fetchRange(addDays(new Date(), -1), addDays(new Date(), 1));
                if (!res.okCodes.length) {
                    liveError = true;
                    return;
                }
                res.matches.forEach(m => store.set(m.id, m));
                liveError = false;
                failedLeagues = res.failed;
            } else {
                const from = addDays(currentDate, -DAYS_BACK);
                const to = addDays(currentDate, DAYS_AHEAD);
                const res = await fetchRange(from, to);
                if (!res.okCodes.length) {
                    await loadArchive();
                    failedLeagues = 0;
                } else {
                    // Sostituisce le competizioni scaricate, tiene quelle che hanno dato errore
                    const keep = [...store.values()].filter(m => !res.okCodes.includes(m.competition?.code));
                    store.clear();
                    keep.forEach(m => store.set(m.id, m));
                    res.matches.forEach(m => store.set(m.id, m));
                    source = 'live';
                    windowFrom = formatDate(from);
                    windowTo = formatDate(to);
                    failedLeagues = res.failed;
                }
                liveError = false;
                lastFull = Date.now();
            }
            loaded = true;
            lastUpdate = new Date();
        }

        async function refresh(mode) {
            if (inflight) await inflight.catch(() => {});
            inflight = doRefresh(mode);
            try {
                await inflight;
            } finally {
                inflight = null;
            }
        }

        function needsFull() {
            if (!loaded) return true;
            if (source === 'archive') return false;
            const day = formatDate(currentDate);
            return day < windowFrom || formatDate(addDays(currentDate, 3)) > windowTo;
        }

        // ---- Rendering: elenco ----
        function leagueOk(m) {
            return !selectedLeague || m.competition?.code === selectedLeague;
        }

        function matchesForDay(date) {
            const day = formatDate(date);
            return [...store.values()].filter(m => {
                if (!m.utcDate || formatDate(new Date(m.utcDate)) !== day) return false;
                return leagueOk(m);
            });
        }

        function statusInfo(match) {
            switch (match.status) {
                case 'IN_PLAY':
                case 'LIVE':
                    return { text: match.clock ? `In diretta · ${match.clock}` : 'In diretta', live: true };
                case 'PAUSED':
                    return { text: 'Intervallo', live: true };
                case 'FINISHED':
                case 'AWARDED': {
                    const d = String(match.detail || '');
                    if (/pen/i.test(d)) return { text: 'Finale · rigori', live: false };
                    if (/aet|extra/i.test(d)) return { text: 'Finale · supplementari', live: false };
                    return { text: 'Finale', live: false };
                }
                case 'POSTPONED':
                    return { text: 'Rinviata', live: false };
                case 'SUSPENDED':
                    return { text: 'Sospesa', live: false };
                case 'CANCELLED':
                    return { text: 'Annullata', live: false };
                case 'SCHEDULED':
                case 'TIMED': {
                    if (!match.utcDate) return { text: 'Da definire', live: false };
                    const d = new Date(match.utcDate);
                    const day = d.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' });
                    return { text: `${day} · ${timeOf(d)}`, live: false };
                }
                default:
                    return { text: match.status || '', live: false };
            }
        }

        // Etichetta breve nella colonna di sinistra di ogni partita
        function statusShort(match) {
            switch (match.status) {
                case 'IN_PLAY':
                case 'LIVE':
                    return { top: match.clock || 'Live', sub: 'In diretta', cls: 'live' };
                case 'PAUSED':
                    return { top: 'Int.', sub: 'Intervallo', cls: 'live' };
                case 'FINISHED':
                case 'AWARDED': {
                    const d = String(match.detail || '');
                    if (/pen/i.test(d)) return { top: 'Finale', sub: 'ai rigori', cls: '' };
                    if (/aet|extra/i.test(d)) return { top: 'Finale', sub: 'dopo suppl.', cls: '' };
                    return { top: 'Finale', sub: '', cls: '' };
                }
                case 'POSTPONED': return { top: 'Rinviata', sub: '', cls: '' };
                case 'SUSPENDED': return { top: 'Sospesa', sub: '', cls: '' };
                case 'CANCELLED': return { top: 'Annullata', sub: '', cls: '' };
                default:
                    return match.utcDate
                        ? { top: timeOf(new Date(match.utcDate)), sub: 'Inizio', cls: 'soon' }
                        : { top: 'Da def.', sub: '', cls: '' };
            }
        }

        // Elenco dei marcatori (e dei rossi) di una squadra, sotto al suo nome
        function scorersHtml(match, team) {
            const tid = String(team.id);
            const items = (match.events || []).filter(e => e.tid === tid).map(e => {
                if (e.k === 'r') return `<span class="sc"><i class="card red"></i>${escapeHtml(e.n)} ${escapeHtml(e.m)}</span>`;
                const note = e.k === 'p' ? ' (rig.)' : e.k === 'o' ? ' (aut.)' : '';
                return `<span class="sc">${icon('i-ball')}${escapeHtml(e.n)}${note} ${escapeHtml(e.m)}</span>`;
            });
            return items.length ? `<div class="scorers">${items.join('')}</div>` : '';
        }

        function teamRow(match, team, score, hasScore, lose) {
            const fav = isFav(team);
            const pts = hasScore ? `<span class="pts">${score}</span>` : '';
            return `<div class="trow"><div class="row${lose ? ' lose' : ''}${fav ? ' fav' : ''}"><span class="team">${crestHtml(team)}<span class="name">${escapeHtml(team.name)}</span>${starHtml(team, fav)}</span>${pts}</div>${scorersHtml(match, team)}</div>`;
        }

        function matchCellHtml(match) {
            const sh = match.score?.fullTime?.home;
            const sa = match.score?.fullTime?.away;
            const hasScore = hasStarted(match) && sh != null && sa != null;
            const finished = isFinished(match);
            const st = statusShort(match);
            const home = match.homeTeam || { name: 'Squadra' };
            const away = match.awayTeam || { name: 'Squadra' };
            const hasFav = isFav(home) || isFav(away);
            const label = `Dettagli: ${home.name} contro ${away.name}`;

            return `
                <article class="match${hasFav ? ' has-fav' : ''}">
                    <div class="mstat ${st.cls}">${escapeHtml(st.top)}${st.sub ? `<small>${escapeHtml(st.sub)}</small>` : ''}</div>
                    <div class="mbody">
                        ${teamRow(match, home, sh, hasScore, finished && hasScore && sh < sa)}
                        ${teamRow(match, away, sa, hasScore, finished && hasScore && sa < sh)}
                    </div>
                    <button type="button" class="open" data-id="${escapeHtml(match.id)}" aria-label="${escapeHtml(label)}" title="Tocca per i dettagli"></button>
                </article>`;
        }

        function blockHtml(matches) {
            const cells = matches.map(matchCellHtml);
            // Su due colonne, con numero dispari di partite, riempie la cella vuota.
            if (matches.length % 2 === 1) cells.push('<div class="filler" aria-hidden="true"></div>');
            return `<div class="matches">${cells.join('')}</div>`;
        }

        function leagueOrder(code) {
            const i = leagues.findIndex(l => l.code === code);
            return i < 0 ? 999 : i;
        }

        function groupsHtml(matches) {
            const groups = new Map();
            matches.forEach(m => {
                const key = m.competition?.code || m.competition?.name || '?';
                if (!groups.has(key)) groups.set(key, { name: m.competition?.name || 'Competizione', code: key, list: [] });
                groups.get(key).list.push(m);
            });
            return [...groups.values()]
                .sort((a, b) => leagueOrder(a.code) - leagueOrder(b.code))
                .map((g, i) => `
                    <section class="group">
                        <div class="group-head"><h2>${escapeHtml(g.name)}</h2><span class="count">${g.list.length}</span>${i === 0 ? '<span class="hint-tap">Tocca una partita per i dettagli</span>' : ''}</div>
                        ${blockHtml(g.list.sort(byTime))}
                    </section>`).join('');
        }

        function liveGroupHtml(live) {
            return `
                <section class="section">
                    <div class="section-head"><span class="live-dot" aria-hidden="true"></span><h2>In diretta ora</h2><span class="count">${live.length}</span></div>
                    ${blockHtml(live)}
                </section>`;
        }

        // Giorno più vicino (prima o dopo) con partite, per non lasciare la pagina vuota
        function nearestDay(dir) {
            const cur = formatDate(currentDate);
            const days = new Set();
            for (const m of store.values()) {
                if (!m.utcDate || !leagueOk(m)) continue;
                const d = formatDate(new Date(m.utcDate));
                if (dir > 0 ? d > cur : d < cur) days.add(d);
            }
            const sorted = [...days].sort();
            return sorted.length ? (dir > 0 ? sorted[0] : sorted[sorted.length - 1]) : null;
        }

        function emptyHtml(message) {
            const prev = nearestDay(-1);
            const next = nearestDay(1);
            const fmt = d => parseDay(d).toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' });
            const jumps = [
                prev ? `<button type="button" data-goto="${prev}">← ${escapeHtml(fmt(prev))}</button>` : '',
                next ? `<button type="button" data-goto="${next}">${escapeHtml(fmt(next))} →</button>` : ''
            ].join('');
            return `<section class="section"><div class="note"><strong>${escapeHtml(message)}</strong>${
                jumps ? `Vai al giorno più vicino con partite:<div class="jump">${jumps}</div>` : 'Prova un altro giorno o un’altra competizione.'
            }</div></section>`;
        }

        // ---- Rendering: la tua squadra ----
        function favCardHtml(match, label) {
            const home = match.homeTeam;
            const away = match.awayTeam;
            const sh = match.score?.fullTime?.home;
            const sa = match.score?.fullTime?.away;
            const hasScore = sh != null && sa != null && hasStarted(match);
            const status = statusInfo(match);
            const finished = isFinished(match);
            const d = match.utcDate ? new Date(match.utcDate) : null;

            let mid;
            if (hasScore) {
                mid = `<div class="big">${sh} – ${sa}</div><div class="small${status.live ? ' live' : ''}">${escapeHtml(status.text)}</div>`;
            } else if (isUpcoming(match) && d) {
                mid = `<div class="big">${escapeHtml(timeOf(d))}</div><div class="small">${escapeHtml(d.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' }))}</div>`;
            } else {
                mid = `<div class="big">–</div><div class="small">${escapeHtml(status.text)}</div>`;
            }

            const side = (team, score, other) => `
                <div class="side${isFav(team) ? ' me' : ''}${finished && hasScore && score < other ? ' lose' : ''}">
                    ${crestHtml(team, 'lg')}
                    <span class="sname">${escapeHtml(team.name)}</span>
                </div>`;

            return `
                <article class="favcard">
                    <div class="match-top">
                        <span class="tag">${escapeHtml(label)}</span>
                        <span class="comp">${escapeHtml(match.competition?.name || '')}</span>
                    </div>
                    <div class="versus">${side(home, sh, sa)}<div class="mid">${mid}</div>${side(away, sa, sh)}</div>
                    <button type="button" class="open" data-id="${escapeHtml(match.id)}" aria-label="Dettagli: ${escapeHtml(home.name)} contro ${escapeHtml(away.name)}"></button>
                </article>`;
        }

        function renderFavorite() {
            if (!favorite) {
                favBar.hidden = true;
                favHint.hidden = false;
                favSection.hidden = true;
                lastHtml.favBar = lastHtml.fav = null;
                return;
            }

            const team = favoriteTeam();
            favHint.hidden = true;
            favBar.hidden = false;
            setHtml('favBar', favBar, `${crestHtml(team, 'sm')}<span><span class="label">Squadra preferita:</span> <span class="fname">${escapeHtml(team.name)}</span></span><button type="button" id="favClear">Rimuovi</button>`);

            const mine = [...store.values()].filter(m => isFav(m.homeTeam) || isFav(m.awayTeam)).sort(byTime);
            const live = mine.find(isLive);
            const next = mine.find(isUpcoming);
            const last = [...mine].reverse().find(isFinished);

            const cards = [];
            if (live) cards.push(favCardHtml(live, 'In diretta'));
            else if (last) cards.push(favCardHtml(last, 'Ultimo risultato'));
            if (next) cards.push(favCardHtml(next, 'Prossima partita'));

            favSection.hidden = false;
            setHtml('fav', favContainer, cards.length
                ? `<div class="favcards">${cards.join('')}</div>`
                : `<div class="note">Nessuna partita di ${escapeHtml(team.name)} nelle competizioni seguite, nei prossimi giorni.</div>`);
        }

        function renderUpdated() {
            let text;
            if (!lastUpdate) text = 'aggiornamento in corso…';
            else if (source === 'archive') text = 'dati live non raggiungibili, mostro l\'ultimo salvataggio';
            else {
                text = `aggiornato alle ${timeOf(lastUpdate)}`;
                if (liveError) text += ' · connessione persa, riprovo';
                else if (failedLeagues) text += ` · ${failedLeagues} competizioni non disponibili`;
            }
            updatedEl.textContent = text;
        }

        function renderStatusSeg(counts) {
            const tabs = [
                { id: 'all', label: 'Tutte', n: counts.all },
                { id: 'live', label: 'In diretta', n: counts.live, dot: counts.live > 0 },
                { id: 'results', label: 'Risultati', n: counts.results },
                { id: 'upcoming', label: 'In programma', n: counts.upcoming }
            ];
            setHtml('seg', statusSeg, tabs.map(t =>
                `<button type="button" data-status="${t.id}" aria-pressed="${statusFilter === t.id ? 'true' : 'false'}">${t.dot ? '<span class="livedot" aria-hidden="true"></span>' : ''}${t.label}<span class="n">${t.n}</span></button>`
            ).join(''));
        }

        function render() {
            const dayStr = formatDate(currentDate);
            const viewingToday = dayStr === formatDate(new Date());
            const outOfRange = source === 'archive' && (!windowFrom || dayStr < windowFrom || dayStr > windowTo);

            const day = matchesForDay(currentDate);
            // Oggi si mostrano tutte le partite in corso, anche quelle iniziate prima di mezzanotte
            const live = (viewingToday
                ? [...store.values()].filter(m => isLive(m) && leagueOk(m))
                : day.filter(isLive)).sort(byTime);
            const liveIds = new Set(live.map(m => m.id));
            const rest = day.filter(m => !liveIds.has(m.id));
            const results = rest.filter(m => !isUpcoming(m) && !isLive(m));
            const upcoming = rest.filter(isUpcoming);

            const counts = { all: live.length + rest.length, live: live.length, results: results.length, upcoming: upcoming.length };
            renderStatusSeg(counts);

            let html;
            if (outOfRange) {
                html = `<section class="section"><div class="note">${windowFrom
                    ? `Dati disponibili solo dal ${windowFrom.split('-').reverse().join('/')} al ${windowTo.split('-').reverse().join('/')}.`
                    : 'Dati in arrivo: attendi il primo aggiornamento.'}</div></section>`;
            } else if (statusFilter === 'live') {
                html = live.length ? liveGroupHtml(live) : emptyHtml('Nessuna partita in diretta in questo momento.');
            } else if (statusFilter === 'results') {
                html = results.length ? groupsHtml(results) : emptyHtml('Nessun risultato per questa data.');
            } else if (statusFilter === 'upcoming') {
                html = upcoming.length ? groupsHtml(upcoming) : emptyHtml('Nessuna partita in programma per questa data.');
            } else if (counts.all) {
                html = (live.length ? liveGroupHtml(live) : '') + groupsHtml(rest);
            } else {
                html = emptyHtml('Nessuna partita per questa data.');
            }
            setHtml('list', listContainer, html);

            renderFavorite();
            renderUpdated();
            if (dlg.open) renderDialog();
        }

        function renderError(err) {
            lastHtml.list = null;
            listContainer.innerHTML = `<section class="section"><div class="note error"><strong>Dati non disponibili</strong>${escapeHtml(err.message || 'Dati reali non disponibili in questo momento.')}</div></section>`;
        }

        function renderLeagueFilters() {
            const container = $('leagueFilterContainer');
            container.innerHTML = '';
            [{ code: '', name: 'Tutte le competizioni' }, ...leagues].forEach(league => {
                const btn = document.createElement('button');
                btn.className = 'chip';
                btn.type = 'button';
                btn.textContent = league.name;
                if ((selectedLeague || '') === league.code) btn.classList.add('active');
                btn.addEventListener('click', () => {
                    container.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedLeague = league.code || null;
                    render();
                });
                container.appendChild(btn);
            });
        }

        // ---- Barra dei giorni ----
        function updateDateUI() {
            const today = formatDate(new Date());
            const cur = formatDate(currentDate);
            $('selected-date').textContent = cap(currentDate.toLocaleDateString('it-IT', {
                weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
            }));
            $('todayBtn').hidden = cur === today;
            $('datePicker').value = cur;

            let html = '';
            for (let i = -STRIP_RADIUS; i <= STRIP_RADIUS; i++) {
                const d = addDays(currentDate, i);
                const key = formatDate(d);
                const wd = d.toLocaleDateString('it-IT', { weekday: 'short' }).replace('.', '');
                html += `<button type="button" class="day${key === cur ? ' sel' : ''}${key === today ? ' today' : ''}" data-day="${key}" aria-pressed="${key === cur ? 'true' : 'false'}" aria-label="${escapeHtml(d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }))}"><span class="dw">${escapeHtml(wd)}</span><span class="dn">${d.getDate()}</span><span class="dot"></span></button>`;
            }
            dayStrip.innerHTML = html;
            const sel = dayStrip.querySelector('.sel');
            if (sel) dayStrip.scrollLeft = sel.offsetLeft - (dayStrip.clientWidth - sel.offsetWidth) / 2;
        }

        // ---- Caricamento e aggiornamento ----
        async function load() {
            const id = ++requestId;
            if (needsFull()) {
                lastHtml.list = null;
                listContainer.innerHTML = '<section class="section"><div class="note">Caricamento…</div></section>';
                try {
                    await refresh('full');
                } catch (err) {
                    if (id === requestId) renderError(err);
                    return;
                }
                if (id !== requestId) return;
            }
            render();
        }

        function needsFastPolling() {
            const now = Date.now();
            for (const m of store.values()) {
                if (isLive(m)) return true;
                if (isUpcoming(m)) {
                    const t = new Date(m.utcDate).getTime();
                    if (t - now < 20 * 60000 && now - t < 3 * 3600000) return true;
                }
            }
            return false;
        }

        async function tick() {
            const full = source === 'archive' || Date.now() - lastFull > FULL_REFRESH_MS;
            try {
                await refresh(full ? 'full' : 'live');
            } catch (err) {
                liveError = true;
            }
            render();
        }

        function scheduleTick() {
            clearTimeout(tickTimer);
            tickTimer = setTimeout(async () => {
                if (!document.hidden) await tick();
                scheduleTick();
            }, needsFastPolling() ? LIVE_REFRESH_MS : IDLE_REFRESH_MS);
        }

        function setDate(date) {
            currentDate = date;
            updateDateUI();
            load();
        }

        // ---- Dettaglio partita (dati dal servizio "summary" di ESPN) ----
        function slugFor(m) {
            return m.competition?.slug || leagues.find(l => l.code === m.competition?.code)?.slug || '';
        }

        async function loadDetail(id) {
            const m = store.get(id) || dlgMatch;
            if (!m) return;
            const slug = slugFor(m);
            try {
                if (!slug) throw new Error('Competizione non riconosciuta.');
                const res = await fetch(`${ESPN_URL}/${slug}/summary?event=${encodeURIComponent(id)}`, { cache: 'no-store' });
                if (!res.ok) throw new Error(`ESPN ha risposto ${res.status}`);
                details.set(id, { data: await res.json() });
            } catch (err) {
                if (!details.get(id)?.data) details.set(id, { error: err });
            }
            if (openId === id) renderDialog();
        }

        function openMatch(id, push = true) {
            const m = store.get(String(id));
            if (!m) return;
            openId = String(id);
            dlgMatch = m;
            openTab = hasStarted(m) ? 'cronaca' : 'info';
            if (!details.get(openId)?.data) details.delete(openId);
            lastHtml.dlgTop = lastHtml.dlgHead = lastHtml.dlgTabs = lastHtml.dlgBody = null;
            renderDialog();
            dlg.scrollTop = 0;
            if (!dlg.open) {
                if (typeof dlg.showModal === 'function') dlg.showModal();
                else dlg.setAttribute('open', '');
            }
            document.documentElement.classList.add('noscroll');
            if (push) history.pushState({ m: openId }, '', location.pathname + location.search + '#partita');
            loadDetail(openId);
            clearInterval(detailTimer);
            detailTimer = setInterval(() => {
                const cur = store.get(openId) || dlgMatch;
                if (openId && cur && (isLive(cur) || isUpcoming(cur)) && !document.hidden) loadDetail(openId);
            }, DETAIL_REFRESH_MS);
        }

        dlg.addEventListener('close', () => {
            openId = null;
            clearInterval(detailTimer);
            document.documentElement.classList.remove('noscroll');
            dlgBody.querySelectorAll('video').forEach(v => v.pause());
            if (history.state && history.state.m) history.back();
        });

        dlg.addEventListener('click', event => {
            if (event.target === dlg) dlg.close();
        });

        window.addEventListener('popstate', () => {
            if (dlg.open) dlg.close();
        });

        function videoList(d) {
            const order = { sintesi: 0, gol: 1, commento: 2 };
            return (d.videos || []).map(v => {
                const head = String(v.headline || '');
                let kind = 'commento';
                if (/highlights/i.test(head)) kind = 'sintesi';
                else if (/\b(scores?|goal|back of the net|strike|penalty|header|volley|free.?kick|equali[sz]er|opens the scoring|winner)\b/i.test(head)) kind = 'gol';
                return {
                    id: String(v.id),
                    head,
                    src: v.links?.source?.HD?.href || v.links?.source?.href || '',
                    thumb: v.thumbnail || '',
                    dur: num(v.duration),
                    kind,
                    web: v.links?.web?.href || ''
                };
            }).filter(v => v.src || v.web).sort((a, b) => order[a.kind] - order[b.kind]);
        }

        const hasStats = d => !!d.boxscore?.teams?.some(t => t.statistics?.length);
        const hasLineups = d => !!d.rosters?.some(r => r.roster?.length);

        function tabsFor(m, d) {
            const tabs = [hasStarted(m) ? { id: 'cronaca', label: 'Cronaca' } : { id: 'info', label: 'Info' }];
            if (d && hasStats(d)) tabs.push({ id: 'stats', label: 'Statistiche' });
            if (d && hasLineups(d)) tabs.push({ id: 'lineups', label: 'Formazioni' });
            const vids = d ? videoList(d) : [];
            if (vids.length) tabs.push({ id: 'video', label: 'Video', badge: vids.length });
            return tabs;
        }

        function dlgTopHtml(m) {
            const dt = m.utcDate ? new Date(m.utcDate) : null;
            const when = dt ? `${cap(dt.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' }))} · ${timeOf(dt)}` : '';
            return `<div class="sh-meta"><span class="comp">${escapeHtml(m.competition?.name || 'Competizione')}</span><span>${escapeHtml(when)}</span></div>
                <button type="button" class="iconbtn" data-close aria-label="Chiudi"><svg><use href="#i-close"/></svg></button>`;
        }

        function dlgHeadHtml(m, d) {
            const home = m.homeTeam;
            const away = m.awayTeam;
            const sh = m.score?.fullTime?.home;
            const sa = m.score?.fullTime?.away;
            const started = hasStarted(m);
            const hasScore = started && sh != null && sa != null;
            const finished = isFinished(m);
            const status = statusInfo(m);
            const dt = m.utcDate ? new Date(m.utcDate) : null;
            const pen = m.score?.penalties;

            let mid;
            if (hasScore) {
                mid = `<div class="big">${sh} – ${sa}</div><div class="small${status.live ? ' live' : ''}">${escapeHtml(status.text)}</div>${pen ? `<div class="small">rigori ${pen.home}–${pen.away}</div>` : ''}`;
            } else if (isUpcoming(m) && dt) {
                mid = `<div class="big">${escapeHtml(timeOf(dt))}</div><div class="small">Non ancora iniziata</div>`;
            } else {
                mid = `<div class="big">–</div><div class="small">${escapeHtml(status.text)}</div>`;
            }

            const side = (team, score, other) => `
                <div class="side${isFav(team) ? ' me' : ''}${finished && hasScore && score < other ? ' lose' : ''}">
                    ${crestHtml(team, 'lg')}
                    <span class="sname">${escapeHtml(team.name)}</span>
                </div>`;

            const evText = e => `<b>${escapeHtml(e.n)}</b>${e.k === 'p' ? ' (rig.)' : e.k === 'o' ? ' (aut.)' : ''} ${escapeHtml(e.m)}`;
            const evIcon = e => e.k === 'r' ? '<i class="card red"></i>' : icon('i-ball');
            const col = (team, cls) => {
                const evs = (m.events || []).filter(e => e.tid === String(team.id));
                return `<div class="gl ${cls}">${evs.map(e => cls === 'h'
                    ? `<div class="ln">${evText(e)}${evIcon(e)}</div>`
                    : `<div class="ln">${evIcon(e)}${evText(e)}</div>`).join('')}</div>`;
            };
            const goals = (m.events || []).length ? `<div class="goals2">${col(home, 'h')}<div class="gm"></div>${col(away, 'a')}</div>` : '';

            const gi = d?.gameInfo;
            const v = gi?.venue;
            const parts = [];
            if (v?.fullName) parts.push(v.fullName + (v.address?.city ? `, ${v.address.city}` : ''));
            if (gi?.attendance) parts.push(`${Number(gi.attendance).toLocaleString('it-IT')} spettatori`);
            const venue = parts.length ? `<div class="venue">${escapeHtml(parts.join(' · '))}</div>` : '';

            return `
                <div class="versus">${side(home, sh, sa)}<div class="mid">${mid}</div>${side(away, sa, sh)}</div>
                ${goals}${venue}`;
        }

        function timelineHtml(m, d) {
            const homeId = String(m.homeTeam.id);
            const evs = (d.keyEvents || []).map((e, i) => ({ e, i }))
                .sort((a, b) => ((a.e.period?.number || 0) - (b.e.period?.number || 0)) || ((a.e.clock?.value || 0) - (b.e.clock?.value || 0)) || (a.i - b.i))
                .map(x => x.e);

            const row = (side, min, score, ico, name, sub) => {
                const txt = `<div><div class="who">${escapeHtml(name)}</div>${sub ? `<div class="sub">${escapeHtml(sub)}</div>` : ''}</div>`;
                const l = side === 'h' ? `<div class="evcell l">${txt}${ico}</div>` : '<div class="evcell l"></div>';
                const r = side === 'a' ? `<div class="evcell r">${ico}${txt}</div>` : '<div class="evcell r"></div>';
                return `<div class="ev">${l}<div class="mn">${escapeHtml(min)}${score ? `<b>${score}</b>` : ''}</div>${r}</div>`;
            };
            const divider = text => `<div class="evdiv">${escapeHtml(text)}</div>`;

            let h = 0, a = 0, shootout = false;
            const rows = [];
            for (const e of evs) {
                const t = e.type?.type || '';
                const tid = e.team?.id != null ? String(e.team.id) : '';
                const side = tid === '' ? '' : (tid === homeId ? 'h' : 'a');
                const min = fixMin(e.clock?.displayValue);
                const p = e.participants || [];
                const who = p[0]?.athlete?.displayName || '';

                if (t === 'halftime') { rows.push(divider(`Intervallo · ${h}–${a}`)); continue; }
                if (t === 'end-regular-time') { rows.push(divider(`Fine tempi regolamentari · ${h}–${a}`)); continue; }

                if (e.shootout) {
                    if (!shootout) { shootout = true; rows.push(divider('Calci di rigore')); }
                    if (!side || !who) continue;
                    const scored = /scored/.test(t);
                    rows.push(row(side, '', '', scored ? icon('i-ball', 'goal-ico') : icon('i-miss', 'miss'), who, scored ? 'Segnato' : 'Sbagliato'));
                    continue;
                }

                if (e.scoringPlay) {
                    if (side === 'h') h++; else if (side === 'a') a++;
                    const own = /own/.test(t);
                    const kind = own ? 'Autogol' : /penalty/.test(t) ? 'Rigore' : /header/.test(t) ? 'Di testa' : '';
                    const assist = !own && p[1]?.athlete?.displayName;
                    const sub = [kind, assist ? `Assist: ${assist}` : ''].filter(Boolean).join(' · ');
                    rows.push(row(side || 'h', min, `${h}–${a}`, icon('i-ball', 'goal-ico'), who, sub));
                    continue;
                }

                if (!side) continue;
                if (t === 'yellow-card') rows.push(row(side, min, '', '<i class="card"></i>', who, 'Ammonito'));
                else if (/red-card/.test(t)) rows.push(row(side, min, '', '<i class="card red"></i>', who, 'Espulso'));
                else if (t === 'substitution') {
                    const out = p[1]?.athlete?.displayName;
                    rows.push(row(side, min, '', icon('i-in', 'in'), who, out ? `Esce ${out}` : 'Sostituzione'));
                } else if (/penalty/.test(t) && /(missed|saved)/.test(t)) {
                    rows.push(row(side, min, '', icon('i-miss', 'miss'), who || 'Rigore', /saved/.test(t) ? 'Rigore parato' : 'Rigore sbagliato'));
                }
            }

            if (!rows.length) return `<div class="note">${isLive(m) ? 'Ancora nessun evento: la cronaca si aggiorna da sola.' : 'Cronaca non disponibile per questa partita.'}</div>`;
            if (isLive(m)) rows.reverse(); // in diretta: l'evento più recente in cima
            return `<div class="tl">${rows.join('')}</div>`;
        }

        const STATS = [
            ['possessionPct', 'Possesso palla', 'pct'],
            ['totalShots', 'Tiri'],
            ['shotsOnTarget', 'Tiri in porta'],
            ['wonCorners', 'Calci d\'angolo'],
            ['foulsCommitted', 'Falli'],
            ['offsides', 'Fuorigioco'],
            ['yellowCards', 'Ammonizioni'],
            ['redCards', 'Espulsioni'],
            ['saves', 'Parate'],
            ['totalPasses', 'Passaggi'],
            ['passAcc', 'Precisione passaggi', 'pct'],
            ['totalTackles', 'Contrasti'],
            ['interceptions', 'Intercetti'],
            ['totalClearance', 'Rinvii']
        ];

        function statsHtml(m, d) {
            const teams = d.boxscore?.teams || [];
            const home = teams.find(t => t.homeAway === 'home') || teams[0];
            const away = teams.find(t => t.homeAway === 'away') || teams[1];
            if (!home || !away) return '<div class="note">Statistiche non disponibili.</div>';

            const get = (t, name) => parseFloat((t.statistics || []).find(s => s.name === name)?.displayValue);
            const val = (t, key) => {
                if (key === 'passAcc') {
                    const acc = get(t, 'accuratePasses');
                    const tot = get(t, 'totalPasses');
                    return tot > 0 ? Math.round(acc / tot * 100) : NaN;
                }
                return get(t, key);
            };

            const rows = [];
            for (const [key, label, kind] of STATS) {
                const a = val(home, key);
                const b = val(away, key);
                if (!Number.isFinite(a) || !Number.isFinite(b) || (a === 0 && b === 0)) continue;
                const pct = kind === 'pct';
                const fmt = v => pct ? `${Math.round(v)}%` : String(Math.round(v * 10) / 10);
                const wa = pct ? a : (a / (a + b) * 100);
                const wb = pct ? b : (b / (a + b) * 100);
                rows.push(`
                    <div class="stat">
                        <div class="stat-top"><span class="v h">${fmt(a)}</span><span class="lbl">${escapeHtml(label)}</span><span class="v a">${fmt(b)}</span></div>
                        <div class="bars">
                            <div class="bar h"><i class="${a > b ? 'lead' : ''}" style="width:${Math.min(100, wa).toFixed(1)}%"></i></div>
                            <div class="bar"><i class="${b > a ? 'lead' : ''}" style="width:${Math.min(100, wb).toFixed(1)}%"></i></div>
                        </div>
                    </div>`);
            }
            if (!rows.length) return '<div class="note">Statistiche non ancora disponibili.</div>';
            return `<div class="statteams"><span class="team">${crestHtml(m.homeTeam, 'sm')}${escapeHtml(m.homeTeam.name)}</span><span class="team">${escapeHtml(m.awayTeam.name)}${crestHtml(m.awayTeam, 'sm')}</span></div>${rows.join('')}`;
        }

        function lineupsHtml(m, d) {
            const rosters = d.rosters || [];
            const home = rosters.find(r => r.homeAway === 'home') || rosters[0];
            const away = rosters.find(r => r.homeAway === 'away') || rosters[1];
            const stat = (p, n) => parseFloat((p.stats || []).find(s => s.name === n)?.displayValue) || 0;

            const player = (p, bench) => {
                const marks = [];
                const goals = stat(p, 'totalGoals');
                if (goals) marks.push(`${icon('i-ball')}${goals > 1 ? `×${goals}` : ''}`);
                if (stat(p, 'yellowCards')) marks.push('<i class="card"></i>');
                if (stat(p, 'redCards')) marks.push('<i class="card red"></i>');
                if (p.subbedOut) marks.push(icon('i-out', 'out'));
                if (p.subbedIn) marks.push(icon('i-in', 'in'));
                const name = p.athlete?.displayName || p.athlete?.shortName || '';
                return `<div class="pl${bench ? ' bench' : ''}"><span class="n">${escapeHtml(p.jersey || '')}</span><span class="nm">${escapeHtml(name)}</span><span class="mk">${marks.join('')}</span><span class="pos">${escapeHtml(p.position?.abbreviation || '')}</span></div>`;
            };

            const col = (r, team) => {
                if (!r) return '<div></div>';
                const list = r.roster || [];
                const starters = list.filter(p => p.starter).sort((x, y) => (num(x.formationPlace) || 99) - (num(y.formationPlace) || 99));
                const bench = list.filter(p => !p.starter);
                return `<div>
                    <div class="lu-head"><span class="team">${crestHtml(team, 'sm')}${escapeHtml(team.name)}</span><span class="form">${escapeHtml(r.formation || '')}</span></div>
                    <div class="lu-sub">Titolari</div>
                    ${starters.map(p => player(p, false)).join('')}
                    ${bench.length ? `<div class="lu-sub">Panchina</div>${bench.map(p => player(p, true)).join('')}` : ''}
                </div>`;
            };

            return `<div class="lineups">${col(home, m.homeTeam)}${col(away, m.awayTeam)}</div>`;
        }

        function infoHtml(m, d) {
            const dt = m.utcDate ? new Date(m.utcDate) : null;
            const gi = d.gameInfo;
            const rows = [['Competizione', m.competition?.name || '']];
            if (dt) rows.push(['Data e ora', `${cap(dt.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }))}, ${timeOf(dt)}`]);
            if (gi?.venue?.fullName) rows.push(['Stadio', gi.venue.fullName + (gi.venue.address?.city ? `, ${gi.venue.address.city}` : '')]);

            const comp = d.header?.competitions?.[0];
            const pills = form => String(form || '').split('').map(c => {
                const cls = c === 'W' ? 'w' : c === 'D' ? 'd' : 'l';
                const txt = c === 'W' ? 'V' : c === 'D' ? 'N' : 'P';
                return `<span class="fp ${cls}" title="${txt === 'V' ? 'Vittoria' : txt === 'N' ? 'Pareggio' : 'Sconfitta'}">${txt}</span>`;
            }).join('');
            const formCol = (team, homeAway) => {
                const c = comp?.competitors?.find(x => x.homeAway === homeAway);
                return c?.form ? `<div class="formcol"><span class="team">${crestHtml(team, 'sm')}${escapeHtml(team.name)}</span><div class="pills">${pills(c.form)}</div></div>` : '';
            };
            const forms = formCol(m.homeTeam, 'home') + formCol(m.awayTeam, 'away');

            return `<div class="infobox">
                ${rows.map(([k, v]) => `<div class="inforow"><span>${escapeHtml(k)}</span><span>${escapeHtml(v)}</span></div>`).join('')}
                ${forms ? `<div><div class="lu-sub" style="padding-top:0">Ultime 5 partite (V vittoria · N pareggio · P sconfitta)</div><div class="formrow">${forms}</div></div>` : ''}
            </div>`;
        }

        function videosHtml(m, d) {
            const vids = videoList(d);
            const tag = { sintesi: 'Sintesi', gol: 'Gol', commento: 'Commento' };
            const dur = s => s != null ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : '';
            const cards = vids.map((v, i) => `
                <div class="vid">
                    <button type="button" class="vthumb" data-play="${i}" aria-label="Riproduci: ${escapeHtml(v.head)}">
                        ${v.thumb ? `<img src="${escapeHtml(v.thumb)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">` : ''}
                        <span class="play">${icon('i-play')}</span>
                        ${v.dur != null ? `<span class="dur">${dur(v.dur)}</span>` : ''}
                    </button>
                    <div class="vmeta"><span class="vtag">${tag[v.kind]}</span><span class="vtitle">${escapeHtml(v.head)}</span></div>
                </div>`).join('');
            return `<div class="vids">${cards}</div><p class="vnote">Video forniti da ESPN, i commenti sono in inglese. Se un video non parte, si può aprire su ESPN.</p>`;
        }

        function playVideo(button) {
            const det = details.get(openId);
            if (!det?.data) return;
            const v = videoList(det.data)[Number(button.dataset.play)];
            if (!v) return;
            dlgBody.querySelectorAll('video').forEach(el => el.pause());
            const fail = () => {
                const msg = document.createElement('div');
                msg.className = 'vmsg';
                msg.innerHTML = v.web
                    ? `Questo video non si riesce a riprodurre qui. <a href="${escapeHtml(v.web)}" target="_blank" rel="noopener noreferrer">Aprilo su ESPN</a>.`
                    : 'Questo video non si riesce a riprodurre.';
                player.replaceWith(msg);
            };
            const player = document.createElement('video');
            if (!v.src) return button.replaceWith(player), fail();
            player.controls = true;
            player.autoplay = true;
            player.playsInline = true;
            player.preload = 'auto';
            if (v.thumb) player.poster = v.thumb;
            player.src = v.src;
            player.addEventListener('error', fail);
            button.replaceWith(player);
            player.play?.().catch(() => {});
        }

        function dlgBodyHtml(m, d, det, tab) {
            if (!d) {
                if (det.error) {
                    return `<div class="note error"><strong>Dettagli non disponibili</strong>${escapeHtml(det.error.message || 'Riprova tra poco.')}<br><button type="button" class="retry" data-retry>Riprova</button></div>`;
                }
                return '<div class="note">Caricamento dei dettagli…</div>';
            }
            switch (tab) {
                case 'stats': return statsHtml(m, d);
                case 'lineups': return lineupsHtml(m, d);
                case 'video': return videosHtml(m, d);
                case 'info': return infoHtml(m, d);
                default: return timelineHtml(m, d);
            }
        }

        function renderDialog() {
            if (!openId) return;
            const m = store.get(openId) || dlgMatch;
            if (!m) return;
            dlgMatch = m;
            const det = details.get(openId) || {};
            const d = det.data;
            dlg.setAttribute('aria-label', `${m.homeTeam.name} – ${m.awayTeam.name}`);
            setHtml('dlgTop', dlgTop, dlgTopHtml(m));
            setHtml('dlgHead', dlgHead, dlgHeadHtml(m, d));
            const tabs = tabsFor(m, d);
            if (!tabs.some(t => t.id === openTab)) openTab = tabs[0].id;
            setHtml('dlgTabs', dlgTabs, tabs.map(t =>
                `<button type="button" class="tab" role="tab" data-tab="${t.id}" aria-selected="${t.id === openTab ? 'true' : 'false'}">${t.label}${t.badge ? `<span class="badge">${t.badge}</span>` : ''}</button>`
            ).join(''));
            setHtml('dlgBody', dlgBody, dlgBodyHtml(m, d, det, openTab));
        }

        // ---- Temi ----
        let themePref = (() => {
            try { return localStorage.getItem(THEME_KEY) || 'night'; } catch (e) { return 'night'; }
        })();

        function resolveTheme(pref) {
            return pref === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night') : pref;
        }

        function renderThemeMenu() {
            $('themeMenu').innerHTML = '<h2>Tema</h2>' + THEMES.map(t =>
                `<button type="button" class="theme-opt" data-theme-id="${t.id}" aria-pressed="${t.id === themePref ? 'true' : 'false'}"><span class="sw" style="background:${t.swatch}"><i style="background:${t.dot}"></i></span>${t.name}</button>`
            ).join('');
        }

        function applyTheme(pref, save = true) {
            if (!THEMES.some(t => t.id === pref)) pref = 'night';
            themePref = pref;
            const theme = resolveTheme(pref);
            document.documentElement.dataset.theme = theme;
            $('metaTheme').content = THEMES.find(t => t.id === theme)?.bg || '#111214';
            if (save) {
                try { localStorage.setItem(THEME_KEY, pref); } catch (e) { /* storage non disponibile */ }
            }
            renderThemeMenu();
        }

        function setThemeMenu(open) {
            $('themeMenu').hidden = !open;
            $('themeBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
        }

        matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', () => {
            if (themePref === 'auto') applyTheme('auto', false);
        });

        // ---- Avvio ----
        function init() {
            applyTheme(themePref, false);
            renderLeagueFilters();
            updateDateUI();
            load().then(scheduleTick);

            $('prevDayBtn').addEventListener('click', () => setDate(addDays(currentDate, -1)));
            $('nextDayBtn').addEventListener('click', () => setDate(addDays(currentDate, 1)));
            $('todayBtn').addEventListener('click', () => setDate(new Date()));
            $('themeBtn').addEventListener('click', () => setThemeMenu($('themeMenu').hidden));

            const picker = $('datePicker');
            $('calBtn').addEventListener('click', () => {
                try { picker.showPicker(); } catch (e) { picker.focus(); picker.click(); }
            });
            picker.addEventListener('change', () => {
                if (picker.value) setDate(parseDay(picker.value));
            });

            document.addEventListener('keydown', event => {
                if (event.key === 'Escape') setThemeMenu(false);
            });

            document.addEventListener('click', event => {
                const t = event.target;
                if (!t.closest('.theme-wrap')) setThemeMenu(false);

                const star = t.closest('.star');
                if (star) { toggleFavorite(star.dataset.key, star.dataset.name); return; }

                const open = t.closest('.open');
                if (open) { openMatch(open.dataset.id); return; }

                const day = t.closest('.day');
                if (day) { setDate(parseDay(day.dataset.day)); return; }

                const seg = t.closest('[data-status]');
                if (seg) { statusFilter = seg.dataset.status; render(); return; }

                const go = t.closest('[data-goto]');
                if (go) { setDate(parseDay(go.dataset.goto)); return; }

                const themeOpt = t.closest('.theme-opt');
                if (themeOpt) { applyTheme(themeOpt.dataset.themeId); return; }

                if (t.closest('#favClear')) { favorite = null; saveFavorite(); render(); return; }

                const tab = t.closest('.tab');
                if (tab) {
                    openTab = tab.dataset.tab;
                    renderDialog();
                    dlg.scrollTop = Math.min(dlg.scrollTop, dlgHead.offsetHeight);
                    return;
                }

                if (t.closest('[data-close]')) { dlg.close(); return; }

                if (t.closest('[data-retry]')) {
                    details.delete(openId);
                    renderDialog();
                    loadDetail(openId);
                    return;
                }

                const play = t.closest('[data-play]');
                if (play) playVideo(play);
            });

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && loaded && (!lastUpdate || Date.now() - lastUpdate.getTime() > 30000)) {
                    tick().then(scheduleTick);
                }
            });
        }

        init();
    </script>
</body>
</html>
