<!DOCTYPE html>
<html lang="it" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Footscan</title>
    <meta name="description" content="Footscan: risultati, marcatori e dettagli delle partite di calcio, dati reali e aggiornati.">
    <meta name="theme-color" content="#111214" id="metaTheme">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        // Applica subito il tema scelto, prima che la pagina venga disegnata (niente lampo di colore).
        (function () {
            try {
                var pref = localStorage.getItem('footscan:theme') || 'night';
                var theme = pref === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night') : pref;
                document.documentElement.dataset.theme = theme;
            } catch (e) { /* storage non disponibile: resta il tema Notte */ }
        })();
    </script>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ---- Temi: ogni tema cambia solo questi colori, lo stile resta lo stesso ---- */
        :root, :root[data-theme="night"] {
            color-scheme: dark;
            --bg: #111214;
            --surface: #17181b;
            --line: #26282c;
            --text: #ececea;
            --muted: #8d9097;
            --accent: #e9b35f;
            --accent-ink: #111214;
            --crest-bg: #ececea;
            --crest-ink: #26282c;
            --good: #3fae6a;
            --bad: #e0524a;
            --shadow: rgba(0, 0, 0, 0.45);
            --font: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        :root[data-theme="day"] {
            color-scheme: light;
            --bg: #f7f6f2; --surface: #ffffff; --line: #e1dfd7; --text: #17181b; --muted: #6a6d74;
            --accent: #a85f00; --accent-ink: #ffffff; --crest-bg: #ffffff; --crest-ink: #26282c;
            --good: #2e8f56; --bad: #cf3d35; --shadow: rgba(30, 30, 30, 0.18);
        }

        :root[data-theme="pitch"] {
            color-scheme: dark;
            --bg: #0b1a11; --surface: #112419; --line: #1e3a29; --text: #e8f1ea; --muted: #84a08f;
            --accent: #b6f04a; --accent-ink: #0b1a11; --crest-bg: #e8f1ea; --crest-ink: #1e3a29;
            --good: #5fd68a; --bad: #ef6b60; --shadow: rgba(0, 0, 0, 0.5);
        }

        :root[data-theme="gazzetta"] {
            color-scheme: light;
            --bg: #f8d9d2; --surface: #fce8e3; --line: #e6b9b0; --text: #2a1517; --muted: #80575a;
            --accent: #c0134f; --accent-ink: #ffffff; --crest-bg: #ffffff; --crest-ink: #2a1517;
            --good: #2e8f56; --bad: #b3261e; --shadow: rgba(80, 20, 20, 0.2);
        }

        :root[data-theme="ocean"] {
            color-scheme: dark;
            --bg: #0a1624; --surface: #0f2036; --line: #1b3350; --text: #e6f0fa; --muted: #7f9bb8;
            --accent: #4cc9f0; --accent-ink: #0a1624; --crest-bg: #e6f0fa; --crest-ink: #0f2036;
            --good: #4fd18b; --bad: #f0685f; --shadow: rgba(0, 0, 0, 0.5);
        }

        :root[data-theme="sunset"] {
            color-scheme: dark;
            --bg: #1a1020; --surface: #231629; --line: #37223e; --text: #f6eaef; --muted: #a8909f;
            --accent: #ff8a5b; --accent-ink: #1a1020; --crest-bg: #f6eaef; --crest-ink: #37223e;
            --good: #5fd18f; --bad: #ff6b6b; --shadow: rgba(0, 0, 0, 0.5);
        }

        :root[data-theme="contrast"] {
            color-scheme: dark;
            --bg: #000000; --surface: #0f0f0f; --line: #5c5c5c; --text: #ffffff; --muted: #d0d0d0;
            --accent: #ffe600; --accent-ink: #000000; --crest-bg: #ffffff; --crest-ink: #000000;
            --good: #4cd97b; --bad: #ff6b6b; --shadow: rgba(0, 0, 0, 0.7);
        }

        html {
            -webkit-text-size-adjust: 100%;
            --pad: clamp(20px, 5vw, 48px);
        }

        html.noscroll, html.noscroll body {
            overflow: hidden;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            transition: background 0.25s ease, color 0.25s ease;
        }

        .wrap {
            width: 100%;
            max-width: calc(960px + 2 * var(--pad));
            margin: 0 auto;
            padding: 0 var(--pad);
        }

        button {
            font: inherit;
            color: inherit;
        }

        button:focus-visible, .open:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        svg.ico {
            width: 1em;
            height: 1em;
            flex-shrink: 0;
            vertical-align: -0.14em;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        /* ---- Barra in alto ---- */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 30;
            padding-top: env(safe-area-inset-top);
            background: var(--bg);
            background: color-mix(in srgb, var(--bg) 90%, transparent);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
        }

        .topbar .wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            height: 62px;
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 12px;
            min-width: 0;
        }

        h1 {
            font-size: 1.45rem;
            font-weight: 600;
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .tagline {
            color: var(--muted);
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .iconbtn {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            background: none;
            border: 1px solid var(--line);
            border-radius: 10px;
            color: var(--muted);
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .iconbtn:hover {
            background: var(--surface);
            color: var(--text);
        }

        .iconbtn svg {
            width: 18px;
            height: 18px;
        }

        /* Selettore temi */
        .theme-wrap {
            position: relative;
        }

        .theme-menu {
            position: absolute;
            right: 0;
            top: calc(100% + 10px);
            width: min(320px, calc(100vw - 2 * var(--pad)));
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 16px 14px 12px;
            box-shadow: 0 24px 60px var(--shadow);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px 6px;
        }

        .theme-menu[hidden] { display: none; }

        .theme-menu h2 {
            grid-column: 1 / -1;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 2px;
        }

        .theme-opt {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 4px 0;
            background: none;
            border: 0;
            border-radius: 10px;
            color: var(--muted);
            font-size: 0.74rem;
            cursor: pointer;
        }

        .theme-opt:hover { color: var(--text); }

        .theme-opt .sw {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--line);
            display: grid;
            place-items: center;
            overflow: hidden;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .theme-opt .sw i {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        .theme-opt:hover .sw { transform: scale(1.06); }

        .theme-opt[aria-pressed="true"] { color: var(--text); font-weight: 600; }
        .theme-opt[aria-pressed="true"] .sw { border-color: var(--accent); }

        /* ---- Controlli ---- */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-top: 24px;
        }

        .dayhead {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        #selected-date {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.015em;
            line-height: 1.25;
        }

        .dayactions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .pillbtn {
            height: 40px;
            padding: 0 16px;
            background: none;
            border: 1px solid var(--line);
            border-radius: 10px;
            color: var(--muted);
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .pillbtn:hover {
            background: var(--surface);
            color: var(--text);
        }

        .pillbtn[hidden] { display: none; }

        .datewrap { position: relative; }

        .datewrap input {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
        }

        .days {
            display: flex;
            align-items: stretch;
            gap: 8px;
        }

        .daynav {
            width: 36px;
            flex-shrink: 0;
            height: auto;
        }

        .strip {
            flex: 1;
            min-width: 0;
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: minmax(46px, 1fr);
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .strip::-webkit-scrollbar { display: none; }

        .day {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            padding: 8px 0 7px;
            background: none;
            border: 1px solid var(--line);
            border-radius: 10px;
            color: var(--muted);
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .day:hover { background: var(--surface); }

        .day .dw {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.07em;
        }

        .day .dn {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
            font-variant-numeric: tabular-nums;
            line-height: 1.3;
        }

        .day .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: transparent;
        }

        .day.today .dot { background: var(--accent); }

        .day.sel {
            background: var(--text);
            border-color: var(--text);
        }

        .day.sel .dw, .day.sel .dn { color: var(--bg); }
        .day.sel.today .dot { background: var(--accent); }

        .seg {
            align-self: flex-start;
            display: flex;
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
        }

        .seg button {
            display: flex;
            align-items: center;
            gap: 7px;
            height: 40px;
            padding: 0 16px;
            background: none;
            border: 0;
            border-left: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.92rem;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .seg button:first-child { border-left: 0; }
        .seg button:hover { color: var(--text); background: var(--surface); }

        .seg button[aria-pressed="true"] {
            background: var(--text);
            color: var(--bg);
        }

        .seg .n {
            font-size: 0.8rem;
            opacity: 0.75;
            font-variant-numeric: tabular-nums;
        }

        .seg .livedot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 1.6s ease-in-out infinite;
        }

        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .chips::-webkit-scrollbar { display: none; }

        .chip {
            flex-shrink: 0;
            background: none;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--muted);
            padding: 8px 15px;
            font-size: 0.9rem;
            white-space: nowrap;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .chip:hover {
            color: var(--text);
            border-color: var(--muted);
        }

        .chip.active {
            background: var(--text);
            border-color: var(--text);
            color: var(--bg);
        }

        .favbar {
            align-self: flex-start;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--accent);
            border-radius: 999px;
            padding: 5px 6px;
            font-size: 0.9rem;
        }

        .favbar[hidden] { display: none; }
        .favbar .label { color: var(--muted); }
        .favbar .fname { font-weight: 600; color: var(--accent); }

        .favbar button {
            background: none;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--muted);
            padding: 4px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .favbar button:hover { color: var(--text); border-color: var(--muted); }

        .favhint {
            color: var(--muted);
            font-size: 0.85rem;
        }

        .favhint[hidden] { display: none; }

        /* ---- Sezioni e gruppi ---- */
        .section, .group {
            margin-top: clamp(28px, 5vw, 44px);
        }

        .section-head, .group-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .section-head h2, .group-head h2 {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.015em;
            line-height: 1.2;
        }

        .count {
            font-size: 0.95rem;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .hint-tap {
            margin-left: auto;
            color: var(--muted);
            font-size: 0.82rem;
        }

        /* ---- Partite: un blocco con linee sottili ---- */
        .matches {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1px;
            background: var(--line);
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow: hidden;
        }

        .match, .filler {
            background: var(--bg);
        }

        .match {
            position: relative;
            display: grid;
            grid-template-columns: 58px 1fr;
            gap: 12px;
            align-items: start;
            padding: 18px 22px 18px 18px;
            transition: background 0.2s ease;
        }

        .match:hover { background: var(--surface); }

        .match.has-fav { box-shadow: inset 3px 0 0 var(--accent); }

        .mstat {
            padding-top: 3px;
            font-size: 0.82rem;
            font-weight: 600;
            line-height: 1.3;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .mstat.live { color: var(--accent); }
        .mstat.soon { color: var(--text); font-size: 0.95rem; }
        .mstat small { display: block; font-weight: 400; font-size: 0.72rem; margin-top: 2px; }

        .mbody {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .trow { display: flex; flex-direction: column; gap: 4px; }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            font-size: 1.05rem;
            font-weight: 500;
            line-height: 1.3;
        }

        .row .name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .row .pts {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .row.lose { color: var(--muted); }

        .row.fav .name {
            color: var(--accent);
            font-weight: 600;
        }

        .row.fav.lose .name { opacity: 0.75; }

        .scorers {
            display: flex;
            flex-wrap: wrap;
            gap: 2px 12px;
            padding-left: 38px;
            font-size: 0.78rem;
            line-height: 1.45;
            color: var(--muted);
        }

        .sc { white-space: nowrap; }

        .sc svg.ico { margin-right: 3px; color: var(--text); opacity: 0.85; }

        .open {
            position: absolute;
            inset: 0;
            z-index: 1;
            width: 100%;
            background: none;
            border: 0;
            cursor: pointer;
            opacity: 0;
        }

        /* Cartellini */
        .card {
            display: inline-block;
            width: 8px;
            height: 11px;
            border-radius: 2px;
            background: #f2c94c;
            margin-right: 4px;
            vertical-align: -1px;
        }

        .card.red { background: #e0524a; }

        /* Stemmi: sempre in un cerchio, con iniziali se l'immagine non si carica */
        .crest {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            font-size: 1rem;
            border-radius: 50%;
            background: var(--crest-bg);
            box-shadow: inset 0 0 0 1px var(--line);
            display: grid;
            place-items: center;
            overflow: hidden;
            position: relative;
        }

        .crest.lg { width: 56px; height: 56px; font-size: 1.4rem; }
        .crest.sm { width: 22px; height: 22px; font-size: 0.8rem; }

        .crest img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 15%;
        }

        .crest.noimg img { display: none; }

        .crest.noimg::after {
            content: attr(data-initials);
            color: var(--crest-ink);
            font-size: 0.62em;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        /* Stella "squadra preferita" */
        .star {
            position: relative;
            z-index: 2;
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            background: none;
            border: 0;
            border-radius: 50%;
            color: var(--muted);
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s ease, color 0.2s ease, background 0.2s ease;
        }

        .star svg { fill: none; stroke: currentColor; }
        .star:hover { color: var(--accent); background: var(--surface); opacity: 1; }
        .star[aria-pressed="true"] { color: var(--accent); opacity: 1; }
        .star[aria-pressed="true"] svg { fill: currentColor; }

        @media (hover: hover) {
            .star:not([aria-pressed="true"]) { opacity: 0.28; }
            .match:hover .star:not([aria-pressed="true"]) { opacity: 0.8; }
            .star:not([aria-pressed="true"]):hover { opacity: 1; }
        }

        /* ---- La tua squadra ---- */
        .favcards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 12px;
        }

        .favcard {
            position: relative;
            border: 1px solid var(--accent);
            border-radius: 14px;
            background: rgba(233, 179, 95, 0.06);
            background: color-mix(in srgb, var(--accent) 7%, transparent);
            padding: 20px 24px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: background 0.2s ease;
        }

        .favcard:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }

        .match-top {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .match-top .tag { color: var(--accent); font-weight: 600; }

        .comp {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status { flex-shrink: 0; font-weight: 500; font-variant-numeric: tabular-nums; }
        .status.live { color: var(--accent); }

        .versus {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
        }

        .side {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
            min-width: 0;
            font-weight: 500;
            line-height: 1.25;
        }

        .side.me .sname { color: var(--accent); font-weight: 600; }
        .side.lose .sname { color: var(--muted); }

        .mid { text-align: center; font-variant-numeric: tabular-nums; }
        .mid .big { font-size: 2.2rem; font-weight: 600; letter-spacing: -0.03em; line-height: 1; white-space: nowrap; }
        .mid .small { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }
        .mid .small.live { color: var(--accent); font-weight: 500; }

        #updated { font-variant-numeric: tabular-nums; }

        /* Notes: caricamento, vuoto, errore */
        .note {
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 22px 24px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .note strong {
            display: block;
            color: var(--text);
            font-weight: 600;
            margin-bottom: 2px;
        }

        .note.error strong { color: var(--accent); }

        .note .jump {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .note .jump button, .note .retry {
            background: none;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 8px 16px;
            font-size: 0.88rem;
            color: var(--text);
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .note .jump button:hover, .note .retry:hover { background: var(--surface); border-color: var(--muted); }
        .note .retry { margin-top: 12px; }

        footer {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 24px;
            margin-top: clamp(48px, 8vw, 88px);
            padding: 36px 0 calc(44px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--line);
            font-size: 0.9rem;
            color: var(--muted);
        }

        /* ---- Dettaglio partita ---- */
        dialog.sheet {
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--text);
            padding: 0;
            border-radius: 18px;
            width: min(720px, calc(100vw - 32px));
            max-height: min(90vh, 900px);
            height: min(90vh, 900px);
            margin: auto;
            overflow: hidden;
            box-shadow: 0 30px 80px var(--shadow);
        }

        dialog.sheet[open] {
            display: block;
            overflow-y: auto;
            overscroll-behavior: contain;
            --shtop: 66px;
        }

        dialog.sheet::backdrop {
            background: rgba(0, 0, 0, 0.6);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
        }

        .sh-head {
            padding: 8px 24px 22px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sh-top {
            position: sticky;
            top: 0;
            z-index: 5;
            height: var(--shtop);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: var(--bg);
        }

        .sh-meta {
            display: flex;
            flex-direction: column;
            min-width: 0;
            font-size: 0.85rem;
            color: var(--muted);
            line-height: 1.35;
        }

        .sh-meta .comp { color: var(--text); font-weight: 600; font-size: 0.95rem; }

        .goals2 {
            display: grid;
            grid-template-columns: 1fr 22px 1fr;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--muted);
            line-height: 1.5;
        }

        .goals2 .gl { display: flex; flex-direction: column; min-width: 0; }
        .goals2 .gl.h { align-items: flex-end; text-align: right; }
        .goals2 .gl.a { align-items: flex-start; text-align: left; }
        .goals2 .gm { text-align: center; color: var(--muted); opacity: 0.6; }
        .goals2 .ln b { color: var(--text); font-weight: 500; }
        .goals2 svg.ico { margin: 0 4px; }

        .venue {
            text-align: center;
            font-size: 0.82rem;
            color: var(--muted);
        }

        .tabs {
            position: sticky;
            top: var(--shtop);
            z-index: 4;
            background: var(--bg);
            display: flex;
            gap: 4px;
            padding: 0 16px;
            border-bottom: 1px solid var(--line);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar { display: none; }

        .tab {
            position: relative;
            flex-shrink: 0;
            background: none;
            border: 0;
            padding: 14px 12px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .tab:hover { color: var(--text); }

        .tab[aria-selected="true"] { color: var(--text); }

        .tab[aria-selected="true"]::after {
            content: '';
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: -1px;
            height: 2px;
            border-radius: 2px;
            background: var(--accent);
        }

        .tab .badge {
            margin-left: 6px;
            font-size: 0.75rem;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
        }

        .sh-body {
            padding: 8px 24px calc(28px + env(safe-area-inset-bottom));
            min-height: 50%;
        }

        .sh-body .note { margin-top: 16px; }

        /* Cronaca */
        .ev {
            display: grid;
            grid-template-columns: 1fr 58px 1fr;
            align-items: center;
            gap: 8px;
            padding: 11px 0;
            border-bottom: 1px solid var(--line);
        }

        .evcell {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
            line-height: 1.3;
        }

        .evcell.l { justify-content: flex-end; text-align: right; }
        .evcell.r { justify-content: flex-start; text-align: left; }
        .evcell .who { font-weight: 500; }
        .evcell .sub { font-size: 0.78rem; color: var(--muted); }
        .evcell svg.ico { width: 1.1em; height: 1.1em; }
        .evcell .goal-ico { color: var(--text); }
        .evcell .in { color: var(--good); }
        .evcell .out { color: var(--bad); }
        .evcell .miss { color: var(--bad); }

        .mn {
            text-align: center;
            font-size: 0.85rem;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
            line-height: 1.3;
        }

        .mn b { display: block; color: var(--accent); font-weight: 600; font-size: 0.8rem; }

        .evdiv {
            padding: 16px 0 8px;
            text-align: center;
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            color: var(--muted);
        }

        /* Statistiche */
        .stat { padding: 13px 0 12px; border-bottom: 1px solid var(--line); }

        .stat-top {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: baseline;
            gap: 12px;
            font-variant-numeric: tabular-nums;
        }

        .stat-top .v { font-weight: 600; font-size: 1.05rem; }
        .stat-top .v.a { text-align: right; }
        .stat-top .lbl { font-size: 0.85rem; color: var(--muted); text-align: center; }

        .bars {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-top: 8px;
        }

        .bar {
            height: 6px;
            border-radius: 3px;
            background: var(--line);
            overflow: hidden;
            display: flex;
        }

        .bar.h { justify-content: flex-end; }
        .bar i { display: block; height: 100%; border-radius: 3px; background: var(--muted); }
        .bar i.lead { background: var(--accent); }

        .statteams {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 16px 0 4px;
            font-weight: 600;
        }

        .statteams .team:last-child { justify-content: flex-end; }

        /* Formazioni */
        .lineups {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            padding-top: 16px;
        }

        .lu-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-bottom: 8px;
            font-weight: 600;
        }

        .lu-head .form { font-size: 0.85rem; color: var(--muted); font-weight: 500; }

        .lu-sub {
            padding: 16px 0 6px;
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            color: var(--muted);
        }

        .pl {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 0;
            border-bottom: 1px solid var(--line);
            font-size: 0.92rem;
        }

        .pl .n { width: 22px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }
        .pl .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pl .pos { color: var(--muted); font-size: 0.72rem; flex-shrink: 0; }
        .pl .mk { display: flex; align-items: center; gap: 4px; flex-shrink: 0; font-size: 0.82rem; }
        .pl .mk .in { color: var(--good); }
        .pl .mk .out { color: var(--bad); }
        .pl.bench { color: var(--muted); }

        /* Info e forma */
        .infobox { padding-top: 16px; display: flex; flex-direction: column; gap: 18px; }

        .inforow {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--line);
            font-size: 0.95rem;
        }

        .inforow span:first-child { color: var(--muted); }
        .inforow span:last-child { text-align: right; font-weight: 500; }

        .formrow {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .formcol { display: flex; flex-direction: column; gap: 10px; }
        .formcol .pills { display: flex; gap: 5px; }

        .fp {
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            border: 1px solid var(--line);
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--muted);
        }

        .fp.w { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
        .fp.d { background: var(--line); color: var(--text); }

        /* Video */
        .vids {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 14px;
            padding-top: 16px;
        }

        .vid {
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            background: var(--surface);
            display: flex;
            flex-direction: column;
        }

        .vthumb {
            position: relative;
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            padding: 0;
            border: 0;
            background: #000;
            cursor: pointer;
            overflow: hidden;
        }

        .vthumb img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.92; transition: opacity 0.2s ease, transform 0.3s ease; }
        .vthumb:hover img { opacity: 1; transform: scale(1.03); }

        .vthumb .play {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 48px;
            height: 48px;
            margin: -24px 0 0 -24px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--accent-ink);
            display: grid;
            place-items: center;
        }

        .vthumb .play svg { width: 20px; height: 20px; margin-left: 2px; }

        .vthumb .dur {
            position: absolute;
            right: 8px;
            bottom: 8px;
            padding: 2px 7px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            font-size: 0.74rem;
            font-variant-numeric: tabular-nums;
        }

        .vid video { width: 100%; aspect-ratio: 16 / 9; background: #000; display: block; }

        .vmeta { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
        .vtag { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); font-weight: 600; }
        .vtitle { font-size: 0.88rem; line-height: 1.35; }
        .vmsg { padding: 14px 12px; font-size: 0.85rem; color: var(--muted); }
        .vmsg a { color: var(--accent); }

        .vnote { padding-top: 16px; font-size: 0.8rem; color: var(--muted); }

        .goals2 .card, .evcell .card, .pl .mk .card { margin: 0 3px; }
        .evcell .card { margin: 0; }
        .pl .mk .card { margin: 0; }

        /* ---- Telefono ---- */
        @media (max-width: 680px) {
            .tagline { display: none; }
            .favcards { grid-template-columns: 1fr; }
            .favcard { padding: 18px 16px 20px; }
            .matches { grid-template-columns: 1fr; }
            .filler { display: none; }
            .match { grid-template-columns: 52px 1fr; gap: 10px; padding: 16px 16px 16px 14px; }
            .daynav { display: none; }
            .seg { align-self: stretch; }
            .seg button { flex: 1; justify-content: center; padding: 0 6px; font-size: 0.85rem; gap: 5px; }
            #selected-date { font-size: 1.05rem; }
            .hint-tap { display: none; }

            dialog.sheet {
                width: 100vw;
                max-width: 100vw;
                height: 100dvh;
                max-height: 100dvh;
                border-radius: 0;
                border: 0;
            }

            dialog.sheet[open] { --shtop: calc(62px + env(safe-area-inset-top)); }
            .sh-top { padding: env(safe-area-inset-top) 16px 0; }
            .sh-head { padding: 4px 16px 18px; gap: 16px; }
            .sh-body { padding: 4px 16px calc(28px + env(safe-area-inset-bottom)); }
            .tabs { padding: 0 6px; }
            .mid .big { font-size: 1.9rem; }
            .lineups { grid-template-columns: 1fr; gap: 8px; }
            .ev { grid-template-columns: 1fr 50px 1fr; gap: 6px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>

    <header class="topbar">
        <div class="wrap">
            <div class="brand">
                <h1>Footscan</h1>
                <span class="tagline">Risultati, marcatori e dettagli delle partite</span>
            </div>
            <div class="theme-wrap">
                <button type="button" class="iconbtn" id="themeBtn" aria-haspopup="true" aria-expanded="false" aria-label="Cambia tema" title="Cambia tema"><svg><use href="#i-palette"/></svg></button>
